<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Personas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Registro de Personas</h1>

        <form id="persona-form">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="apellido">
                Apellido
            </label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                required
            >

            <label for="edad">
                Edad
            </label>

            <input
                type="number"
                id="edad"
                name="edad"
                min="1"
                required
            >

            <button type="submit">
                Registrar persona
            </button>

        </form>

        <p id="mensaje"></p>

        <section class="personas-section">

            <h2>Personas registradas</h2>

            <div id="personas-lista">
                Cargando personas...
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
